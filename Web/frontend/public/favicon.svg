<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#145534"/>
      <stop offset="100%" stop-color="#072717"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5DBD8B"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="20" fill="url(#shieldGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="19" stroke="#5DBD8B" stroke-opacity="0.3" stroke-width="2" />

  <!-- Radar / Wave Circles -->
  <circle cx="32" cy="32" r="22" stroke="#5DBD8B" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Military Shield Outline -->
  <path d="M32 12L46 17V30C46 39.5 39.8 48.2 32 51C24.2 48.2 18 39.5 18 30V17L32 12Z" 
        stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#shadow)"/>

  <!-- SMS Speech Bubble with Encrypted Lock -->
  <path d="M26 24H38C39.65 24 41 25.35 41 27V34C41 35.65 39.65 37 38 37H31L26 41V37H26C24.35 37 23 35.65 23 34V27C23 25.35 24.35 24 26 24Z" 
        fill="#145534" stroke="#5DBD8B" stroke-width="1.5"/>

  <!-- Padlock in Center -->
  <rect x="29" y="29" width="6" height="5" rx="1" fill="#FFFFFF"/>
  <path d="M30 29V27.5C30 26.4 30.9 25.5 32 25.5C33.1 25.5 34 26.4 34 27.5V29" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Glowing Live Telemetry Pulse Dot -->
  <circle cx="50" cy="14" r="5" fill="#34D399" />
  <circle cx="50" cy="14" r="7" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.5" />
</svg>
